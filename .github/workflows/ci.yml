name: Nuclei Secret Scanning

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  nuclei-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '>=1.20'

      - name: Install Nuclei via Go
        run: |
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Clone nuclei templates
        run: git clone https://github.com/projectdiscovery/nuclei-templates.git

      - name: Run Nuclei secret scanning
        run: |
          "$HOME/go/bin/nuclei" -t ./nuclei-templates/secrets/ -target file://. -o nuclei-secrets-results.txt || true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-secret-scan-results
          path: nuclei-secrets-results.txt
