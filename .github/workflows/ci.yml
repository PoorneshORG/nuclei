name: Nuclei Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  nuclei-secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Nuclei
        run: |
          curl -sSfL https://github.com/projectdiscovery/nuclei/releases/latest/download/nuclei-linux-amd64.tar.gz | tar -xzv
          sudo mv nuclei /usr/local/bin/

      - name: Run Nuclei secret scanning templates
        run: |
          nuclei -t nuclei-templates/secrets/ -o nuclei-secrets-results.txt

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-secret-scan-results
          path: nuclei-secrets-results.txt
